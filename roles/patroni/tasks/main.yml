---
# ─── Add Percona Repository ───────────────────────────────────────────────────

- name: Install gnupg2 and curl
  apt:
    name:
      - gnupg2
      - curl
      - lsb-release
    state: present
    update_cache: yes

- name: Download Percona release package
  get_url:
    url: "https://repo.percona.com/apt/percona-release_latest.generic_all.deb"
    dest: /tmp/percona-release.deb
    mode: "0644"

- name: Install Percona release package
  apt:
    deb: /tmp/percona-release.deb
    state: present

- name: Enable Percona Distribution for PostgreSQL 15
  command: percona-release setup ppg-15
  changed_when: true

- name: Update apt cache after Percona repo
  apt:
    update_cache: yes

# ─── Install PostgreSQL + Patroni via Percona ─────────────────────────────────

- name: Install Percona PostgreSQL 15 + Patroni
  apt:
    name:
      - percona-postgresql-15
      - percona-postgresql-client-15
      - percona-postgresql-contrib-15
      - percona-patroni
    state: present

- name: Stop and disable default PostgreSQL service (Patroni manages it)
  systemd:
    name: "postgresql@15-main"
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Also disable generic postgresql service
  systemd:
    name: postgresql
    state: stopped
    enabled: no
  ignore_errors: yes

# ─── Configure Patroni ────────────────────────────────────────────────────────

- name: Create patroni config directory
  file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Create patroni log directory
  file:
    path: /var/log/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Ensure PostgreSQL data directory exists
  file:
    path: "{{ postgresql_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
    recurse: yes

- name: Fix /var/run/postgresql permission
  file:
    path: /var/run/postgresql
    state: directory
    owner: postgres
    group: postgres
    mode: "0775"

- name: Persist /var/run/postgresql via tmpfiles.d
  copy:
    content: "d /var/run/postgresql 0775 postgres postgres -\n"
    dest: /etc/tmpfiles.d/postgresql.conf
    mode: "0644"

- name: Deploy Patroni configuration
  template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0640"
  notify: restart patroni

- name: Install Patroni systemd service
  template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    mode: "0644"
  notify:
    - reload systemd
    - restart patroni

- name: Enable and start Patroni
  systemd:
    name: patroni
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for Patroni REST API to be available
  uri:
    url: "http://{{ ansible_host }}:{{ patroni_restapi_port }}/health"
    method: GET
    status_code: [200, 503]
  register: patroni_health
  until: patroni_health.status in [200, 503]
  retries: 30
  delay: 10

- name: Wait for a primary to be elected
  uri:
    url: "http://{{ ansible_host }}:{{ patroni_restapi_port }}/master"
    method: GET
    status_code: 200
  register: patroni_master
  until: patroni_master.status == 200
  retries: 30
  delay: 10
  run_once: true
  delegate_to: "{{ groups['patroni'][0] }}"

- name: Show Patroni cluster status
  command: patronictl -c /etc/patroni/patroni.yml list
  become: yes
  become_user: postgres
  register: patroni_status
  changed_when: false
  run_once: true

- name: Display cluster status
  debug:
    msg: "{{ patroni_status.stdout_lines }}"
  run_once: true

# ─── Post-bootstrap ───────────────────────────────────────────────────────────

- name: Create application database
  postgresql_db:
    name: "{{ pg_app_database }}"
    state: present
    login_host: "{{ ansible_host }}"
    login_port: 5432
    login_user: "{{ pg_superuser }}"
    login_password: "{{ pg_superuser_password }}"
  run_once: true
  ignore_errors: yes

- name: Create application user
  postgresql_user:
    name: "{{ pg_app_user }}"
    password: "{{ pg_app_password }}"
    db: "{{ pg_app_database }}"
    priv: ALL
    state: present
    login_host: "{{ ansible_host }}"
    login_port: 5432
    login_user: "{{ pg_superuser }}"
    login_password: "{{ pg_superuser_password }}"
  run_once: true
  ignore_errors: yes
