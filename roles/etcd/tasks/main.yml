---
- name: Install etcd via apt
  apt:
    name: etcd
    state: present

- name: Create etcd config directory
  file:
    path: /etc/etcd
    state: directory
    owner: etcd
    group: etcd
    mode: "0755"

- name: Ensure etcd data directory exists with correct permissions
  file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: Generate etcd configuration
  template:
    src: etcd.conf.j2
    dest: /etc/etcd/etcd.conf
    owner: etcd
    group: etcd
    mode: "0640"
  notify: restart etcd

- name: Install etcd systemd service
  template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  notify:
    - reload systemd
    - restart etcd

- name: Enable and start etcd (non-blocking)
  shell: systemctl enable etcd && systemctl start etcd || true
  changed_when: false

- name: Wait for etcd port to be open
  wait_for:
    host: "{{ ansible_host }}"
    port: "{{ etcd_client_port }}"
    timeout: 60
    delay: 3

- name: Wait for etcd to be healthy
  command: etcdctl endpoint health --endpoints=http://{{ ansible_host }}:{{ etcd_client_port }}
  environment:
    ETCDCTL_API: "3"
  register: etcd_health
  until: etcd_health.rc == 0
  retries: 20
  delay: 5

- name: Verify etcd cluster members
  command: etcdctl member list --endpoints=http://{{ ansible_host }}:{{ etcd_client_port }}
  environment:
    ETCDCTL_API: "3"
  register: etcd_members
  changed_when: false

- name: Show etcd cluster members
  debug:
    msg: "{{ etcd_members.stdout_lines }}"
